<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="A local playable board for the Rookery chess engine."><title>Rookery Board</title><link rel="stylesheet" href="/style.css"></head><body>
<main class="shell"><header><div><p class="eyebrow">LOCAL CHESS ENGINE</p><h1>Rookery <span>Board</span></h1></div><button id="new-game" class="primary" disabled>New game</button></header>
<section class="game" aria-label="Chess game"><div class="board-wrap"><div id="board" class="board" role="grid" aria-label="Chess board"></div></div><aside class="panel"><div class="turn"><span id="turn-dot"></span><div><small>GAME STATUS</small><strong id="status" aria-live="polite">Loading board…</strong></div></div><p id="error" class="error" role="alert" hidden></p><div class="controls"><label for="depth">Engine depth <output id="depth-value">3</output></label><input id="depth" type="range" min="1" max="6" value="3"><button id="flip" class="secondary">Flip board</button></div><section class="moves"><h2>Moves</h2><ol id="move-list" aria-label="Move list"></ol></section><p class="hint">You play White. Select a piece, then choose one of its highlighted legal destinations.</p></aside></section></main>
<dialog id="promotion"><form method="dialog"><p>Choose promotion</p><div class="promotion-choices"><button value="q">Queen</button><button value="r">Rook</button><button value="b">Bishop</button><button value="n">Knight</button></div></form></dialog><script src="/app.js"></script></body></html>
